name: Docker Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker build -t longfiction-ai:${{ github.sha }} .
        docker tag longfiction-ai:${{ github.sha }} longfiction-ai:latest

    - name: Test Docker image
      run: |
        docker run -d --name lf-test -p 8000:8000 \
          -e OPENAI_API_KEY=test \
          -e LLM_USE_RESPONSE_FORMAT=false \
          longfiction-ai:latest
        sleep 10
        curl -f http://localhost:8000/api/health || exit 1
        docker stop lf-test
        docker rm lf-test
